# Baseline benchmark configuration (Packet A).
# Explicit values only, so a run's identity includes every knob. These are the
# shell's documented defaults; nothing experimental is enabled.
fps=60
filter=sharp
stereo=off
wide=on
texscale=1
partialB=off
partialBChar=off
bandPubB=off
sw2d=off
lower30=off
drawerAB=off
# Change detection: each engine reads only the VRAM its frame can show (on by
# default since 2026-11-10: the full hash was 864 KB + 304 KB per drawer pass,
# and the drawer is what bounds presentation on an Old 3DS).
refHashA=on
refHashB=on
